<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwindcss cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-[#dbefdc] min-h-screen max-w-[1920px] mx-auto">

    <div class="flex flex-col w-full min-h-screen">

    
    <div class="flex items-center justify-between w-full max-w-[1920px] h-[60px] bg-white shadow-sm mx-auto py-[24px] px-[60px]">
        
        
        <div class="flex items-center gap-4">
            <img src="assets/logo.png" alt="logo" class="w-10 h-10">
            <h1 class="font-bold font-['Arial_Black'] text-lg md:text-xl text-gray-800 whitespace-nowrap">
                Emergency <br> Service
            </h1>
        </div>
        
        
        <div class="flex items-center gap-4"> 
            <!-- প্রথম বাটন -->
            <button class="btn btn-secondary flex items-center gap-2 px-4 py-2 rounded-3xl font-medium !bg-[#dbefdc] text-black border-none">
                0
                <img src="assets/heart.png" alt="heart" class="w-5 h-5">
            </button>
            
            <!-- দ্বিতীয় বাটন -->
            <button class="btn btn-primary flex items-center gap-2 px-4 py-2 rounded-3xl font-medium !bg-[#dbefdc] text-black border-none">
                100
                <img src="assets/coin.png" alt="coin" class="w-5 h-5">
            </button>
            
            <!-- তৃতীয় বাটন -->
            <button class="btn !bg-green-600 text-white px-4 py-2 rounded-3xl font-medium border-none hover:bg-green-700">
                2Copy
            </button>
        </div>

    </div> 
    <!-- নেববার ক্লোজিং -->

<!-- জরুরি সেবা ডিরেক্টরি শুরু -->
    <div class="w-full max-w-[1920px] mx-auto py-12 px-[60px] flex flex-col items-center text-center justify-center bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223] text-white shadow-lg">
    <img src="assets/logo-dark.png" alt="dark-logo" class="w-16 h-16 mb-4">
    <h1 class="text-3xl font-bold mb-2">জরুরি সেবা ডিরেক্টরি</h1>
    
    <!-- whitespace-nowrap যোগ করা হয়েছে যাতে লেখাটি ভেঙে নিচে না নামে -->
    <p class="text-gray-200 text-base md:text-lg whitespace-nowrap">
        Government Emergency Services at Your Fingertip – A Project by Government of the People’s Republic of Bangladesh
    </p>
    </div>
    <!-- জরুরি সেবা ডিরেক্টরি শেষ -->
     
</body>
</html>
