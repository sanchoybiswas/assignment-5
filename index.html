<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwindcss cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-[#dbefdc] h-[100vh] flex justify-between">
<!-- প্রধান নেববার কন্টেইনার (border-2 border-red-500 আপনার টেস্টের জন্য রাখা হয়েছে) -->
<div class="flex items-center justify-between w-full max-w-[1920px] h-[60px] px-8 bg-white shadow-sm border-2 border-red-500 mx-auto">
    
    <!-- বাম পাশের অংশ: লোগো এবং হেডিং -->
    <div class="flex items-center gap-4">
        <img src="assets/logo.png" alt="logo" class="w-10 h-10">
        <h1 class="font-bold font-['Arial_Black'] text-lg md:text-xl text-gray-800 whitespace-nowrap">
            Emergency <br> Service
        </h1>
    </div>

    <!-- ডান পাশের অংশ: বাটনগুলো -->
    <div class="flex items-center gap-4"> 
        <!-- প্রথম বাটন -->
        <button class="btn btn-secondary flex items-center gap-2 px-4 py-2 rounded-3xl font-medium !bg-[#dbefdc] text-black border-none">
            0
            <img src="assets/heart.png" alt="heart" class="w-5 h-5">
        </button>
        
        <!-- দ্বিতীয় বাটন -->
        <button class="btn btn-primary flex items-center gap-2 px-4 py-2 rounded-3xl font-medium !bg-[#dbefdc] text-black border-none">
            100
            <img src="assets/coin.png" alt="coin" class="w-5 h-5">
        </button>
        
        <!-- তৃতীয় বাটন -->
        <button class="btn !bg-green-600 text-white px-4 py-2 rounded-3xl font-medium border-none hover:bg-green-700">
            2Copy
        </button>
    </div>

</div>
</body>
</html>
