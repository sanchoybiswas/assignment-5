<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwindcss cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-[#dbefdc] min-h-screen max-w-[1920px] mx-auto">

    <div class="flex flex-col w-full min-h-screen">

    
    <div class="flex items-center justify-between w-full max-w-[1920px] h-[60px] bg-white shadow-sm mx-auto py-[24px] px-[60px]">
        
        
        <div class="flex items-center gap-4">
            <img src="assets/logo.png" alt="logo" class="w-10 h-10">
            <h1 class="font-bold font-['Arial_Black'] text-lg md:text-xl text-gray-800 whitespace-nowrap">
                Emergency <br> Service
            </h1>
        </div>
        
        
        <div class="flex items-center gap-4"> 
            <!-- প্রথম বাটন -->
            <button class="btn btn-secondary flex items-center gap-2 px-4 py-2 rounded-3xl font-medium !bg-[#dbefdc] text-black border-none">
                0
                <img src="assets/heart.png" alt="heart" class="w-5 h-5">
            </button>
            
            <!-- দ্বিতীয় বাটন -->
            <button class="btn btn-primary flex items-center gap-2 px-4 py-2 rounded-3xl font-medium !bg-[#dbefdc] text-black border-none">
                100
                <img src="assets/coin.png" alt="coin" class="w-5 h-5">
            </button>
            
            <!-- তৃতীয় বাটন -->
            <button class="btn !bg-green-600 text-white px-4 py-2 rounded-3xl font-medium border-none hover:bg-green-700">
                2Copy
            </button>
        </div>

    </div> 
    <!-- নেববার ক্লোজিং -->

<!-- জরুরি সেবা ডিরেক্টরি শুরু -->
    <div class="w-full max-w-[1920px] mx-auto py-12 px-[60px] flex flex-col items-center text-center justify-center bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223] text-white shadow-lg">
    <img src="assets/logo-dark.png" alt="dark-logo" class="w-16 h-16 mb-4">
    <h1 class="text-3xl font-bold mb-2">জরুরি সেবা ডিরেক্টরি</h1>
    
    <!-- whitespace-nowrap যোগ করা হয়েছে যাতে লেখাটি ভেঙে নিচে না নামে -->
    <p class="text-gray-200 text-base md:text-lg whitespace-nowrap">
        Government Emergency Services at Your Fingertip – A Project by Government of the People’s Republic of Bangladesh
    </p>
    </div>
    <!-- জরুরি সেবা ডিরেক্টরি শেষ -->
        <!-- parent card div star -->
    <div class="w-full max-w-[1920px] mx-auto px-[60px] py-[24px] flex flex-col lg:flex-row gap-6">
    
        <div class="w-full lg:w-[73%]">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col justify-between relative">
                <button class="absolute top-6 right-6 text-gray-400 hover:text-red-500 transition">
                    <i class="far fa-heart text-xl"></i>
                </button>
                <div>
                    <div class="w-12 h-12 bg-red-50 rounded-xl flex items-center justify-center mb-4">
                        <img src="assets/emergency.png" alt="icon" class="w-6 h-6">
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">জাতীয় জরুরি সেবা</h3>
                    <p class="text-sm text-gray-400 mb-4">National Emergency</p>
                    <h2 class="text-3xl font-black text-gray-800 mb-3">999</h2>
                    <span class="inline-block bg-gray-100 text-gray-600 text-xs px-3 py-1 rounded-full font-medium mb-6">সার্বজনীন</span>
                </div>
                <div class="flex gap-4">
                    <button class="flex-1 btn bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 rounded-xl font-medium py-2.5 flex items-center justify-center gap-2">
                        <i class="far fa-copy"></i> Copy
                    </button>
                    <button class="flex-1 btn !bg-green-600 hover:bg-green-700 text-white border-none rounded-xl font-medium py-2.5 flex items-center justify-center gap-2">
                        <i class="fas fa-phone-alt"></i> Call
                    </button>
                </div>
            </div>

            </div>
    </div>
            <!-- <div class="w-full lg:w-[27%] bg-white rounded-2xl p-6 shadow-sm border border-gray-100 min-h-[500px] flex flex-col">
        
                 <div class="flex items-center justify-between border-b border-gray-100 pb-4 mb-4">
                     <div class="flex items-center gap-2 text-gray-800 font-bold text-lg">
                         <i class="far fa-clock text-xl text-gray-600"></i> <span>Call History</span>
                    </div>
                         <button class="btn !bg-[#00a651] hover:bg-[#00853e] text-white px-4 py-1.5 rounded-full text-sm font-medium border-none min-h-0 h-auto">
                            Clear
                        </button>
                </div>

                <div id="call-history-container" class="flex-1 flex flex-col gap-4 overflow-y-auto">
                </div>

         </div> -->
    </div>
    <!-- parent card div end -->
    </div>
</body>
</html>
